version: 1
checks:
  harness-tests:
    command: ["npm", "--prefix", "packages/harness", "test"]
    timeout_seconds: 600
  prompt-contracts:
    command: ["node", "--test", "packages/harness/test/prompt-library-contracts.test.mjs"]
    timeout_seconds: 120
  verify-intent-lock:
    artifacts: ["intent-lock/drive.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-intent-lock.mjs"]
    timeout_seconds: 120
    proof: behavior
  verify-prepare:
    artifacts: ["prepare/drive.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-prepare.mjs"]
    timeout_seconds: 120
    proof: behavior
  verify-issue-worktree:
    artifacts: ["issue-worktree/drive.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-issue-worktree.mjs"]
    timeout_seconds: 120
    proof: behavior
  adaptive-verification-tests:
    command: ["node", "--test", "packages/harness/test/check-artifacts.test.mjs", "packages/harness/test/verification-location.test.mjs", "packages/harness/test/verification-recipes.test.mjs", "packages/harness/test/cli-evidence-verify.test.mjs"]
    timeout_seconds: 300
    proof: behavior
