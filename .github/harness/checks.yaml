version: 1
checks:
  harness-tests:
    command: ["npm", "--prefix", "packages/ae", "test"]
    timeout_seconds: 600
  prompt-contracts:
    command: ["node", "--test", "packages/ae/test/prompt-library-contracts.test.mjs"]
    timeout_seconds: 120
  verify-performance:
    artifacts: ["performance.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-performance.mjs"]
    timeout_seconds: 120
    proof: behavior
  verify-intent-lock:
    artifacts: ["intent-lock/drive.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-intent-lock.mjs"]
    timeout_seconds: 120
    proof: behavior
  verify-prepare:
    artifacts: ["prepare/drive.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-prepare.mjs"]
    timeout_seconds: 120
    proof: behavior
  verify-issue-worktree:
    artifacts: ["issue-worktree/drive.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-issue-worktree.mjs"]
    timeout_seconds: 120
    proof: behavior
  verify-installed-release:
    artifacts: ["installed-release.json"]
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-installed-release.mjs"]
    timeout_seconds: 300
    proof: behavior
  adaptive-verification-tests:
    command: ["node", "--test", "packages/ae/test/check-artifacts.test.mjs", "packages/ae/test/verification-location.test.mjs", "packages/ae/test/verification-recipes.test.mjs", "packages/ae/test/cli-evidence-verify.test.mjs"]
    timeout_seconds: 300
    proof: behavior
  adaptive-intent-tests:
    command: ["node", "--test", "packages/ae/test/adaptive-intent.test.mjs", "packages/ae/test/issue-intake.test.mjs", "packages/ae/test/plan-operations.test.mjs", "packages/ae/test/orient-read-slice.test.mjs"]
    timeout_seconds: 300
    proof: behavior
  adaptive-worklist-tests:
    command: ["node", "--test", "packages/ae/test/scoped-todo.test.mjs", "packages/ae/test/todo-command.test.mjs", "packages/ae/test/plan-operations.test.mjs", "packages/ae/test/hook-runtime.test.mjs"]
    timeout_seconds: 300
    proof: behavior
  adaptive-caffeinated-tests:
    command: ["node", "--test", "packages/ae/test/caffeinated.test.mjs", "packages/ae/test/agent-delivery.test.mjs", "packages/ae/test/plan-operations.test.mjs", "packages/ae/test/hook-runtime.test.mjs", "packages/ae/test/get-command.test.mjs"]
