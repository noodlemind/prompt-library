    proof: behavior
  adaptive-diagnostics-tests:
    command: ["node", "--test", "packages/ae/test/inventory.test.mjs", "packages/ae/test/inventory-editors.test.mjs", "packages/ae/test/inventory-jar.test.mjs", "packages/ae/test/domain-contract.test.mjs", "packages/ae/test/diagnostic-commands.test.mjs", "packages/ae/test/redact.test.mjs", "packages/ae/test/registry.test.mjs", "packages/ae/test/flag-value-guards.test.mjs", "packages/ae/test/command-index-enumerability.test.mjs"]
    timeout_seconds: 180
    proof: behavior
  adaptive-domain-tests:
    command: ["node", "--test", "packages/ae/test/domain-contract.test.mjs", "packages/ae/test/domain-bindings.test.mjs", "packages/ae/test/domain-context.test.mjs", "packages/ae/test/domain-plans.test.mjs", "packages/ae/test/domain-delivery.test.mjs", "packages/ae/test/domain-commands.test.mjs", "packages/ae/test/extended-plan-compatibility.test.mjs", "packages/ae/test/git-context.test.mjs", "packages/ae/test/policy.test.mjs", "packages/ae/test/hook-runtime.test.mjs", "packages/ae/test/registry.test.mjs", "packages/ae/test/flag-value-guards.test.mjs", "packages/ae/test/command-index-enumerability.test.mjs"]
    timeout_seconds: 600
    proof: behavior
  adaptive-experiment-tests:
    command: ["node", "--test", "packages/ae/test/experiment-contract.test.mjs", "packages/ae/test/experiment-isolation.test.mjs", "packages/ae/test/experiment-measurement.test.mjs", "packages/ae/test/experiment-state.test.mjs", "packages/ae/test/experiment-snapshots.test.mjs", "packages/ae/test/experiment-commands.test.mjs", "packages/ae/test/experiment-release.test.mjs", "packages/ae/test/agent-delivery.test.mjs", "packages/ae/test/domain-context.test.mjs", "packages/ae/test/registry.test.mjs", "packages/ae/test/flag-value-guards.test.mjs", "packages/ae/test/command-index-enumerability.test.mjs"]
    timeout_seconds: 600
    proof: behavior
  adaptive-formal-tests:
    command: ["node", "--test", "packages/ae/test/flow-model.test.mjs", "packages/ae/test/flow-model-context.test.mjs", "packages/ae/test/formal-verification.test.mjs", "packages/ae/test/workflow-invariants.test.mjs", "packages/ae/test/package-standalone.test.mjs", "packages/ae/test/release-version.test.mjs", "packages/ae/test/registry.test.mjs", "packages/ae/test/command-index-contract.test.mjs", "packages/ae/test/command-index-enumerability.test.mjs", "packages/ae/test/command-index-envelope.test.mjs"]
