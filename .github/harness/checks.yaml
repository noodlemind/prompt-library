    timeout_seconds: 180
    proof: behavior
  verify-workflow-invariants:
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-workflow-invariants.mjs"]
    artifacts: ["workflow-invariants/drive.json"]
    timeout_seconds: 180
    proof: behavior
  verify-workflow-invariants-negative:
    command: ["node", ".cursor/skills/verify-harness/scripts/prove-workflow-invariants.mjs", "--negative-control"]
    artifacts: ["workflow-invariants-negative/drive.json"]
    timeout_seconds: 180
    proof: behavior
  verify-formal-delivery:
    command: ["node", ".cursor/skills/verify-harness/formal/delivery-evidence/scripts/check.mjs", "--manifest", ".cursor/skills/verify-harness/formal/delivery-evidence/manifest.json"]
    artifacts: ["formal-verification.json"]
    timeout_seconds: 300
    proof: behavior
