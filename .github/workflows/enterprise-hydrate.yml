# Publishes enterprise overlay artifact for team hydrate pipelines.
# Customize ORG_ENTERPRISE_REPO secret to your platform overlay repository.
name: Enterprise Hydrate

on:
  push:
    branches: [main]
    paths:
      - 'enterprise/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate enterprise registry
        run: |
          test -f enterprise/capability-registry.enterprise.yaml
          test -f enterprise/README.md
      - name: Archive enterprise overlay
        run: |
          tar -czf enterprise-overlay.tar.gz enterprise/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-overlay
          path: enterprise-overlay.tar.gz
          retention-days: 90

# DevEx: extract artifact to ~/.copilot/enterprise/ or document in harness upgrade runbook
