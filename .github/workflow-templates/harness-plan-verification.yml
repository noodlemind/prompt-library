name: AE plan diagnostics (manual)

# No delivery proof: this template never approves trust or runs product commands.
# New private plans live on their author's machine and are unavailable in CI.
# Select an intentionally committed ordinary plan and a separately qualified AE
# archive. A trusted named-check CI workflow needs its own reviewed authority
# and cannot inherit a developer's local approval or editor review evidence.
on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Public HTTPS URL of a separately qualified ae-harness archive
        required: true
      archive_sha256:
        description: Expected SHA-256 of the qualified archive (64 hexadecimal characters)
        required: true
      plan_path:
        description: Explicit committed ordinary plan under docs/plans (Markdown)
        required: true

permissions:
  contents: read

jobs:
  plan-diagnostics:
    name: Plan readiness and token budgets (no delivery proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AE_HOME: ${{ runner.temp }}/ae-diagnostic-home
      AE_NO_EVENTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate explicit diagnostic inputs
        id: inputs
        shell: bash
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          PLAN: ${{ inputs.plan_path }}
        run: |
          set -euo pipefail
          if [[ ! "$ARCHIVE_URL" =~ ^https://[^[:space:]]+$ || ! "$ARCHIVE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "Provide a public HTTPS archive URL and its independently qualified SHA-256." >&2
            exit 1
          fi
          if [[ "$PLAN" != docs/plans/*.md || "$PLAN" == *..* || "$PLAN" == *$'\n'* || "$PLAN" == *$'\r'* ]]; then
            echo "Select an explicit committed ordinary Markdown plan under docs/plans." >&2
            exit 1
          fi
          git ls-files --error-unmatch -- "$PLAN" >/dev/null
          if [[ ! -f "$PLAN" || -L "$PLAN" || "$(realpath -- "$PLAN")" != "$PWD/$PLAN" ]]; then
            echo "The selected plan must be a regular file inside this checkout without redirected ancestors." >&2
            exit 1
          fi

      - name: Install the exact qualified archive offline
        id: install
        shell: bash
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ae-diagnostic-candidate.tgz"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-time 120 --max-filesize 67108864 --output "$archive" -- "$ARCHIVE_URL"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          npm install --global --offline --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/ae-diagnostic-install" "$archive"
          echo "$RUNNER_TEMP/ae-diagnostic-install/bin" >> "$GITHUB_PATH"

      - name: Token budget gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ae-diagnostics"
          ae --version > "$RUNNER_TEMP/ae-diagnostics/ae-version.txt"
          # Missing optional budget surfaces contribute no measurement.
          # A budget pass is not behavioral proof or native-host qualification.
          ae report --check --workspace . > "$RUNNER_TEMP/ae-diagnostics/budgets.txt"

      - name: Inspect explicit plan readiness without executing named checks
        if: always() && steps.install.outcome == 'success'
        shell: bash
        env:
          PLAN: ${{ inputs.plan_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ae-diagnostics"
          ae validate-plan --plan "$PLAN" --enforcement enforce --workspace . --json \
            > "$RUNNER_TEMP/ae-diagnostics/plan-readiness.json"

      - name: Upload diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-plan-diagnostics
          path: ${{ runner.temp }}/ae-diagnostics/
          if-no-files-found: warn
