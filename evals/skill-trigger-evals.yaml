version: 1
description: Trigger precision, recall, outcome, and host coverage for core and commonly confused skills.
hosts: &supported_hosts
  - github-copilot-vscode
  - github-copilot-cli
  - github-copilot-intellij

skills:
  engineer:
    hosts: *supported_hosts
    positive:
      - {prompt: "Investigate and fix the checkout timeout end to end", assertions: ["activate engineer", "own verification"]}
      - {prompt: "Build the audit export feature and prove it works", assertions: ["activate engineer", "create proportional plan"]}
      - {prompt: "Find the cause of this flaky test and implement the fix", assertions: ["activate engineer", "investigate before editing"]}
      - {prompt: "Upgrade this service safely and handle whatever code changes are needed", assertions: ["activate engineer", "resolve gaps on demand"]}
      - {prompt: "Take this bug from reproduction through tested resolution", assertions: ["activate engineer", "report evidence"]}
      - {prompt: "Implement the attached multi-phase engineering plan completely", assertions: ["activate engineer", "preserve plan scope"]}
      - {prompt: "Refactor the ingestion path and verify no behavior regresses", assertions: ["activate engineer", "run deterministic verification"]}
      - {prompt: "Own this reliability improvement from investigation to completion", assertions: ["activate engineer", "remain accountable"]}
      - {prompt: "Investigate the intermittent checkout timeout deeply, but do not edit anything", assertions: ["activate engineer", "select Investigate mode", "no delivery ceremony"]}
      - {prompt: "Trace why startup is slow and report evidence only", assertions: ["activate engineer", "remain read-only", "report uncertainty"]}
    negative:
      - {prompt: "What does this function do?", assertions: ["do not activate engineer", "route btw"]}
      - {prompt: "Review this already-finished diff", assertions: ["do not activate engineer", "route code-review"]}
      - {prompt: "Resume Phase 2 of docs/plans/cache-plan.md", assertions: ["do not activate engineer", "route work-on-task"]}
      - {prompt: "Draft an implementation plan but do not edit code", assertions: ["do not activate engineer", "route plan-issue"]}
      - {prompt: "Create a reusable skill for incident response", assertions: ["do not activate engineer", "route create-primitive"]}
      - {prompt: "Why is this SQL query slow? Answer only", assertions: ["do not activate engineer", "no edits"]}
      - {prompt: "Run a code review and list findings", assertions: ["do not activate engineer", "route code-review"]}
      - {prompt: "Compound the learning from the completed plan", assertions: ["do not activate engineer", "route compound-learnings"]}
      - {prompt: "@engineer, quick question: where is authentication configured?", assertions: ["select Answer mode", "route btw", "do not enter delivery lifecycle"]}
    outcomes:
      - {prompt: "Fix the race condition end to end", assertions: ["outcome includes evidence", "failed or inconclusive is not complete", "Engineer owns final decision"]}
      - {prompt: "Investigate why this service sometimes hangs; answer only", assertions: ["evidence-backed report", "no plan", "no edits", "no delivery verification"]}
      - {prompt: "First explain why the cache is stale, then fix it", assertions: ["begin read-only", "transition to Deliver before editing", "gate and verify the mutation"]}
      - {prompt: "Investigate this SQS defect without editing", assertions: ["confirmed finding packet", "Capture for Later and Plan and Fix offered", "Leave in Chat available", "no durable knowledge"]}
      - {prompt: "Edit this schema even though no gate exists yet", assertions: ["blocked mutation", "ensure-plan recovery", "implement gate passed", "original edit retried", "fresh verification"]}

  ensure-plan:
    hosts: *supported_hosts
    positive:
      - {prompt: "Trackable work has no plan; create and lock one", assertions: ["activate ensure-plan", "plan_schema 1"]}
      - {prompt: "The matched plan is open and plan_lock is false", assertions: ["activate ensure-plan", "research then lock"]}
      - {prompt: "Create a proportional plan before implementation", assertions: ["activate ensure-plan", "populate named checks"]}
      - {prompt: "Deduplicate plans and lock the correct one", assertions: ["activate ensure-plan", "avoid duplicate"]}
      - {prompt: "Capture this multi-file task and establish scope", assertions: ["activate ensure-plan", "set impacted files"]}
      - {prompt: "The implement gate failed because no plan exists", assertions: ["activate ensure-plan", "repair gate precondition"]}
      - {prompt: "Fill the intent contract and lock this plan", assertions: ["activate ensure-plan", "mirror intent fields"]}
      - {prompt: "Prepare an executable plan with trusted verification names", assertions: ["activate ensure-plan", "no shell strings"]}
    negative:
      - {prompt: "Execute the locked plan now", assertions: ["do not activate ensure-plan", "route work-on-task"]}
      - {prompt: "Review the plan quality", assertions: ["do not activate ensure-plan", "route document-review"]}
      - {prompt: "Resolve a missing security reviewer", assertions: ["do not activate ensure-plan", "route ensure-capability"]}
      - {prompt: "Write a one-paragraph answer with no edits", assertions: ["do not activate ensure-plan", "route btw"]}
      - {prompt: "Verify the finished plan", assertions: ["do not activate ensure-plan", "use harness verify"]}
      - {prompt: "Compound learning after tests passed", assertions: ["do not activate ensure-plan", "route auto-compound"]}
      - {prompt: "Create a new prompt wrapper primitive", assertions: ["do not activate ensure-plan", "route create-primitive"]}
      - {prompt: "Fix an isolated failing unit test", assertions: ["do not activate ensure-plan", "route tdd-fix"]}
    outcomes:
      - {prompt: "Create and lock a plan for this feature", assertions: ["one deduplicated plan", "intent and scope explicit", "named verification mapped", "plan_lock true"]}
      - {prompt: "Change one named schema from a supplied reference and validate it", assertions: ["fast path eligible", "canonical plan schema", "one phase", "no broad scan", "focused trusted verification"]}
      - {prompt: "The schema change also requires a data migration", assertions: ["escalate to normal planning", "record migration risk", "do not use fast path"]}

  plan-issue:
    hosts: *supported_hosts
    positive:
      - {prompt: "Turn this captured issue into a phased plan", assertions: ["activate plan-issue", "research existing patterns"]}
      - {prompt: "Plan this feature without implementing it", assertions: ["activate plan-issue", "produce locked plan"]}
      - {prompt: "Add acceptance criteria and verification mapping to this open plan", assertions: ["activate plan-issue", "make criteria measurable"]}
      - {prompt: "Research the repository and create implementation phases", assertions: ["activate plan-issue", "record research notes"]}
      - {prompt: "Lock docs/plans/search-plan.md after planning", assertions: ["activate plan-issue", "set phase 1"]}
      - {prompt: "Develop an impacted-file allowlist for this captured task", assertions: ["activate plan-issue", "scope explicit"]}
      - {prompt: "Plan review routing for this high-risk issue", assertions: ["activate plan-issue", "record required reviews"]}
      - {prompt: "Convert this issue stub into a testable delivery contract", assertions: ["activate plan-issue", "map evidence"]}
    negative:
      - {prompt: "Implement this already locked plan", assertions: ["do not activate plan-issue", "route work-on-task"]}
      - {prompt: "Create the initial issue stub only", assertions: ["do not activate plan-issue", "route capture-issue"]}
      - {prompt: "Review whether this plan is coherent", assertions: ["do not activate plan-issue", "route document-review"]}
      - {prompt: "Deepen the existing plan interactively", assertions: ["do not activate plan-issue", "route deepen-plan"]}
      - {prompt: "Answer whether this change is risky", assertions: ["do not activate plan-issue", "route btw"]}
      - {prompt: "Verify the implementation", assertions: ["do not activate plan-issue", "use harness verify"]}
      - {prompt: "Resolve the hard capability gap", assertions: ["do not activate plan-issue", "route ensure-capability"]}
      - {prompt: "Review the code diff", assertions: ["do not activate plan-issue", "route code-review"]}
    outcomes:
      - {prompt: "Plan the captured cache invalidation issue", assertions: ["phased tasks", "locked versioned plan", "scope and risks", "criterion evidence mapping"]}

  ensure-capability:
    hosts: *supported_hosts
    positive:
      - {prompt: "The plan explicitly requires a missing Splunk reviewer", assertions: ["activate ensure-capability", "classify hard gap"]}
      - {prompt: "We encountered an unfamiliar security-critical operation", assertions: ["activate ensure-capability", "stop affected operation"]}
      - {prompt: "Investigation is blocked by a missing executable integration", assertions: ["activate ensure-capability", "seek approved tool"]}
      - {prompt: "This schema task needs capability assurance before proceeding", assertions: ["activate ensure-capability", "proactive high-risk check"]}
      - {prompt: "The required Terraform workflow is not installed", assertions: ["activate ensure-capability", "record affected criterion"]}
      - {prompt: "After reading docs I still need specialist judgment", assertions: ["activate ensure-capability", "bounded consultation"]}
      - {prompt: "A repeatable procedure appears absent from installed skills", assertions: ["activate ensure-capability", "check overlap first"]}
      - {prompt: "Resolve this hard capability gap or document a waiver", assertions: ["activate ensure-capability", "record fulfillment"]}
    negative:
      - {prompt: "Start ordinary Java implementation", assertions: ["do not activate ensure-capability", "no universal preflight"]}
      - {prompt: "List every installed skill before work", assertions: ["do not activate ensure-capability", "avoid bulk scan"]}
      - {prompt: "Look up this API in official docs", assertions: ["do not activate ensure-capability", "direct documentation first"]}
      - {prompt: "Create a skill immediately for this one API", assertions: ["do not activate ensure-capability", "insufficient promotion evidence"]}
      - {prompt: "Resume the locked plan", assertions: ["do not activate ensure-capability", "route work-on-task"]}
      - {prompt: "Review completed code", assertions: ["do not activate ensure-capability", "route code-review"]}
      - {prompt: "Draft a plan for a routine feature", assertions: ["do not activate ensure-capability", "route plan-issue"]}
      - {prompt: "Compound a verified gotcha", assertions: ["do not activate ensure-capability", "route auto-compound"]}
    outcomes:
      - {prompt: "Resolve the missing required security capability", assertions: ["gap scoped to criterion", "evidence recorded", "safe work can continue", "hard work remains blocked until fulfilled"]}

  create-primitive:
    hosts: *supported_hosts
    positive:
      - {prompt: "Create a reusable deployment skill from these verified repeated uses", assertions: ["activate create-primitive", "require promotion evidence"]}
      - {prompt: "Add a read-only performance reviewer agent", assertions: ["activate create-primitive", "justify agent boundary"]}
      - {prompt: "Create a scoped Kotlin instruction", assertions: ["activate create-primitive", "set applyTo"]}
      - {prompt: "Add a narrow review check for unsafe retries", assertions: ["activate create-primitive", "one concern"]}
      - {prompt: "Build a thin prompt wrapper for an existing skill", assertions: ["activate create-primitive", "do not duplicate procedure"]}
      - {prompt: "Promote this twice-verified workflow into a skill", assertions: ["activate create-primitive", "add eval suites"]}
      - {prompt: "Decide which prompt-library primitive fits this convention", assertions: ["activate create-primitive", "classify before writing"]}
      - {prompt: "Deprecate and retire this overlapping capability", assertions: ["activate create-primitive", "follow lifecycle"]}
    negative:
      - {prompt: "I used an unfamiliar API once; make a skill", assertions: ["do not create primitive", "record knowledge first"]}
      - {prompt: "Review my code", assertions: ["do not activate create-primitive", "route code-review"]}
      - {prompt: "Import conventions from this external repo", assertions: ["do not activate create-primitive", "route import-conventions"]}
      - {prompt: "Plan this product feature", assertions: ["do not activate create-primitive", "route plan-issue"]}
      - {prompt: "Fix the current bug", assertions: ["do not activate create-primitive", "route engineer"]}
      - {prompt: "Record this verified gotcha as knowledge", assertions: ["do not activate create-primitive", "route compound-learnings"]}
      - {prompt: "Explain the primitive model", assertions: ["do not activate create-primitive", "answer without edits"]}
      - {prompt: "Resolve a missing fact from documentation", assertions: ["do not activate create-primitive", "research first"]}
    outcomes:
      - {prompt: "Promote the verified migration workflow", assertions: ["promotion evidence linked", "owner and lifecycle set", "trigger and outcome evals", "overlap checked"]}
      - {prompt: "Create a Java/Spring/AWS upgrade guide and reusable skill", assertions: ["compare existing java and aws capabilities", "classify primitive", "prefer dense reference", "plan and gate", "primitive verification"]}

  auto-compound:
    hosts: *supported_hosts
    positive:
      - {prompt: "Verification passed; classify and persist the learning", assertions: ["activate auto-compound", "consume evidence"]}
      - {prompt: "After successful delivery, decide whether this is knowledge or a skill candidate", assertions: ["activate auto-compound", "structured recommendation"]}
      - {prompt: "Record the durable gotcha from this passed plan", assertions: ["activate auto-compound", "destination knowledge"]}
      - {prompt: "Classify this repository convention after verify", assertions: ["activate auto-compound", "destination instruction candidate"]}
      - {prompt: "The task passed; evaluate reuse potential", assertions: ["activate auto-compound", "apply promotion test"]}
      - {prompt: "Compound the verified result and update usage telemetry", assertions: ["activate auto-compound", "run harness compound"]}
      - {prompt: "Write memory cards from the passed evidence", assertions: ["activate auto-compound", "bounded source paths"]}
      - {prompt: "Recommend promote-now or record-now-after successful verification", assertions: ["activate auto-compound", "do not create primitive"]}
    negative:
      - {prompt: "Tests failed; compound what we learned", assertions: ["do not activate auto-compound", "verification not passed"]}
      - {prompt: "Verification is inconclusive", assertions: ["do not activate auto-compound", "remain unfinished"]}
      - {prompt: "Create the recommended skill now", assertions: ["do not activate auto-compound", "route create-primitive"]}
      - {prompt: "Implement the current phase", assertions: ["do not activate auto-compound", "route work-on-task"]}
      - {prompt: "Recall prior knowledge", assertions: ["do not activate auto-compound", "route recall"]}
      - {prompt: "Review the code", assertions: ["do not activate auto-compound", "route code-review"]}
      - {prompt: "Draft a plan", assertions: ["do not activate auto-compound", "route plan-issue"]}
      - {prompt: "Create knowledge before solving the task", assertions: ["do not activate auto-compound", "solve and verify first"]}
    outcomes:
      - {prompt: "Compound the passed plan", assertions: ["all classification fields", "evidence path retained", "telemetry updated", "primitive creation remains separate"]}

  compound-learnings:
    hosts: *supported_hosts
    positive:
      - {prompt: "Document this verified fix as a reusable solution", assertions: ["activate compound-learnings", "write solution"]}
      - {prompt: "Publish the passed authentication gotcha to team knowledge", assertions: ["activate compound-learnings", "tag solution"]}
      - {prompt: "Turn these verified implementation notes into a solution document", assertions: ["activate compound-learnings", "link evidence"]}
      - {prompt: "Record the durable query optimization learning", assertions: ["activate compound-learnings", "choose category"]}
      - {prompt: "Create a repo-private solution from the completed plan", assertions: ["activate compound-learnings", "respect scope"]}
      - {prompt: "Publish a cross-repository solution after acceptance", assertions: ["activate compound-learnings", "global knowledge"]}
      - {prompt: "Summarize the root cause and prevention in the solution template", assertions: ["activate compound-learnings", "use template"]}
      - {prompt: "Add this accepted fix to team memory", assertions: ["activate compound-learnings", "index after write"]}
    negative:
      - {prompt: "Classify whether the learning should be promoted", assertions: ["do not activate compound-learnings", "route auto-compound"]}
      - {prompt: "Create a new workflow skill", assertions: ["do not activate compound-learnings", "route create-primitive"]}
      - {prompt: "Tests are failing", assertions: ["do not activate compound-learnings", "not verified"]}
      - {prompt: "Recall a prior solution", assertions: ["do not activate compound-learnings", "route recall"]}
      - {prompt: "Implement the fix", assertions: ["do not activate compound-learnings", "route engineer"]}
      - {prompt: "Review the diff", assertions: ["do not activate compound-learnings", "route code-review"]}
      - {prompt: "Plan the work", assertions: ["do not activate compound-learnings", "route plan-issue"]}
      - {prompt: "Explain this existing solution", assertions: ["do not activate compound-learnings", "answer only"]}
    outcomes:
      - {prompt: "Publish the verified timeout fix", assertions: ["solution uses template", "evidence and prevention recorded", "manifest indexed"]}

  code-review:
    hosts: *supported_hosts
    positive:
      - {prompt: "Review this completed diff for actionable defects", assertions: ["activate code-review", "confidence score findings"]}
      - {prompt: "Run an independent review before merge", assertions: ["activate code-review", "separate judgment"]}
      - {prompt: "Check these changes for security and correctness issues", assertions: ["activate code-review", "route personas"]}
      - {prompt: "Review the implementation against its plan", assertions: ["activate code-review", "check scope and criteria"]}
      - {prompt: "Triage the PR findings by severity and confidence", assertions: ["activate code-review", "structured findings"]}
      - {prompt: "Perform a final code quality review", assertions: ["activate code-review", "avoid implementation"]}
      - {prompt: "Inspect this branch diff and report only real issues", assertions: ["activate code-review", "confidence gate"]}
      - {prompt: "Review the verified changes for remaining risk", assertions: ["activate code-review", "independent review"]}
    negative:
      - {prompt: "Implement the feature", assertions: ["do not activate code-review", "route engineer"]}
      - {prompt: "Fix all issues you find", assertions: ["do not auto-edit", "review authorization only"]}
      - {prompt: "Plan the feature", assertions: ["do not activate code-review", "route plan-issue"]}
      - {prompt: "Resume the current phase", assertions: ["do not activate code-review", "route work-on-task"]}
      - {prompt: "Explain this function", assertions: ["do not activate code-review", "route btw"]}
      - {prompt: "Create a security review skill", assertions: ["do not activate code-review", "route create-primitive"]}
      - {prompt: "Verify named checks", assertions: ["do not activate code-review", "use harness verify"]}
      - {prompt: "Compound the accepted review learning", assertions: ["do not activate code-review", "route auto-compound"]}
    outcomes:
      - {prompt: "Review the completed payment diff", assertions: ["deduplicated actionable findings", "severity and confidence", "no unauthorized edits", "critical findings block completion"]}
