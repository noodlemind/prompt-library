# Initial-qualification release canary — the plan's matrix and budget in data.
profile: release-canary

# Release execution is deliberately fail-closed until every key-bearing trust
# boundary below is implemented and independently reviewed. Deterministic evals
# remain available; no provider request is scheduled while this block is red.
releaseTrust:
  status: blocked
  capabilities:
    fullHarborRuntimeClosureAttested: false
    keyBearingToolchainIsolated: false
    sandboxEntryChainAttested: false
    mountsObservedFromTrustedSupervisor: false
    escapedProcessesAndContainersReaped: false
    imageResourcesAndNetworkObserved: false

task:
  lockFile: evals/external/terminal_bench/task-lock.json

# Cost controls (§10). The ceiling is enforced in code before every provider
# request; the two allowances exhaust the routine ceiling without decorative
# headroom.
budget:
  # Routine target: $10. Operators may override up to the code-enforced
  # absolute ceiling of $20 for a justified calibration.
  releaseCeilingUsd: 10
  kimiPairUsd: 8
  rerunUsd: 2
  # Identical in routine and calibration so stopping policy is part of the
  # controlled condition rather than a repetition-dependent confound.
  controlledArmCeilingUsd: 0.65

# Post-calibration success-parity limits. A correctness win is reported
# separately; parity outside any of these bounds blocks the release claim.
efficiencyThresholds:
  promptRatio: 2.0
  costRatio: 1.5
  wallTimeRatio: 1.25

# A fail→pass result is valuable only inside an explicit willingness-to-pay
# envelope; parity continues to use the ratios above.
valueThresholds:
  maxIncrementalApiCostPerAdditionalSuccessUsd: 2.0
  maxIncrementalWallTimePerAdditionalSuccessMs: 600000

# This profile is for confidence before first user exposure, not merely a
# regression smoke. A green decision needs a supported value claim and at
# least two Harness-solved tasks from the full controlled denominator.
claimPolicy:
  mode: initial-user-ship
  minimumHarnessSolvedTasks: 2
  # The qualifying three-repetition calibration is itself the initial ship
  # decision, so a second routine run cannot create $30 of same-release exposure.
  requireCalibrationBaseline: false
  minimumCalibrationRepetitions: 3

# Independent repetitions per condition per task. Calibration uses 3 (majority
# verdict, median efficiency) to establish variance bands. Routine gating uses
# 1; one exceptional fresh same-task pair is available for the whole controlled
# run. Primary regressions get priority; otherwise it may confirm one one-shot
# win. An unconfirmed one-shot win cannot support demonstrated-value.
repetitions:
  calibration: 3
  routine: 1

pairs:
  # The required OpenRouter pair is fixed by the release runner and its pinned
  # model profile. This list controls only the optional local schedule.
  - host: ollama-gemma
    enabled: true
    schedule: explicit-with-local
    taskRole: anchor

# Optional native-product references. These never enter the controlled A/B
# result because their models, prompts, tools, and subscription metering are
# not normalized to the OpenRouter arm.
nativeProductRotation:
  - codex-subscription
  - claude-subscription

execution:
  # Harbor 0.20 cloud environments do not faithfully materialize host bind
  # mount sources. The causal release path therefore requires local Docker so
  # the attested runtime and treatment-only Harness bytes actually exist.
  environment: docker
  # Image, platform, CPU, memory, and storage are authoritative per task in
  # task-lock.json and are checked against the materialized task TOML.
  # A stable release-SHA offset plus locked-task ordinal gives this four-task
  # matrix an exact 2/2 AB/BA split per repetition without mutable state.
  # Repetitions alternate each task; the exceptional fresh pair reverses its
  # primary order. `--task` remains a non-release diagnostic, so one selected
  # task is not represented as full-lock order balance.
  conditionOrder: release-hash-balanced
