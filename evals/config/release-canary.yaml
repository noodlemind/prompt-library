# Initial-release calibration canary — the plan's matrix and budget in data.
profile: release-canary

# This declaration arms construction of the reviewed per-trial runtime. It is
# still only a kill switch: every paid run begins untrusted and must produce
# fresh supervisor, sandbox-deletion, and provider-reconciliation evidence
# before its report can attest runtime trust.
releaseTrust:
  status: attested
  capabilities:
    fullHarborRuntimeClosureAttested: true
    keyBearingToolchainIsolated: true
    sandboxEntryChainAttested: true
    mountsObservedFromTrustedSupervisor: true
    escapedProcessesAndContainersReaped: true
    imageResourcesAndNetworkObserved: true

task:
  lockFile: evals/external/terminal_bench/task-lock.json

# The controlled role is model-agnostic; this canary currently selects the
# historical Kimi profile explicitly. Change and price-check profileId before
# qualification if another economical model is chosen. Qualification evaluates
# the configured profile; it never selects or replaces one. Both Generic and
# Harness arms resolve this exact same profile, and fallback is rejected.
controlledLane:
  host: openrouter-controlled
  profileId: kimi-k2.7-code

# Cost controls (§10). This canary's $10 base allocation is $8.40 for primary
# work and $1.60 for one rerun; calibration scales that split within $18.70.
# The separate routine profile uses an $8/$2 split. Every provider request is
# checked against its active ceiling.
budget:
  # Base canary ceiling. Calibration may raise this only as far as
  # calibrationCeilingUsd after an accepted qualification baseline.
  releaseCeilingUsd: 10
  controlledPairUsd: 8.4
  rerunUsd: 1.6
  # Qualification and calibration are separate evidence artifacts but one
  # economic decision. Their maximum exposures sum to the absolute $20 cap.
  qualificationPairUsd: 1.3
  calibrationCeilingUsd: 18.7
  # Both phases must reuse one dedicated no-reset key. The runner stores only
  # a release-scoped HMAC fingerprint and rejects key rotation between them.
  providerHardLimitUsd: 20
  # Identical in routine and calibration so stopping policy is part of the
  # controlled condition rather than a repetition-dependent confound.
  controlledArmCeilingUsd: 0.65

# Post-calibration success-parity limits. A correctness win is reported
# separately; parity outside any of these bounds blocks the release claim.
efficiencyThresholds:
  promptRatio: 2.0
  costRatio: 1.5
  wallTimeRatio: 1.25

# A fail→pass result is valuable only inside an explicit willingness-to-pay
# envelope; parity continues to use the ratios above.
valueThresholds:
  maxIncrementalApiCostPerAdditionalSuccessUsd: 2.0
  maxIncrementalWallTimePerAdditionalSuccessMs: 600000

# This profile is for confidence before first user exposure, not merely a
# regression smoke. A green decision needs a supported value claim and at
# least two Harness-solved tasks from the full controlled denominator.
claimPolicy:
  mode: initial-user-ship
  minimumHarnessSolvedTasks: 2
  requireQualificationBaseline: true
  qualificationTask: cobol-modernization
  # The qualifying three-repetition calibration is itself the initial ship
  # decision, so a second routine run cannot create $30 of same-release exposure.
  requireCalibrationBaseline: false
  minimumCalibrationRepetitions: 3

# Independent repetitions per condition per task. Calibration uses 3 (majority
# verdict, median efficiency) to establish variance bands. Routine gating uses
# 1; one exceptional fresh same-task pair is available for the whole controlled
# run. Primary regressions get priority; otherwise it may confirm one one-shot
# win. An unconfirmed one-shot win cannot support demonstrated-value.
repetitions:
  calibration: 3
  routine: 1

pairs:
  # The required OpenRouter pair is fixed by the release runner and its pinned
  # model profile. This list controls only the optional local schedule.
  - host: ollama-gemma
    enabled: true
    schedule: explicit-with-local
    taskRole: anchor

# Optional native-product references. These never enter the controlled A/B
# result because their models, prompts, tools, and subscription metering are
# not normalized to the OpenRouter arm.
nativeProductRotation:
  - codex-subscription
  - claude-subscription

execution:
  # Harbor 0.20 runs inside one fresh 10-GiB Daytona container-DIND sandbox per
  # trial, behind the supervisor-owned private daemon and policy proxy. Direct
  # Harbor `--env daytona` remains unsupported because it cannot preserve the
  # attested mount and Docker-policy boundary used by the controlled pair.
  environment: docker
  # Image, platform, CPU, memory, and storage are authoritative per task in
  # task-lock.json and are checked against the materialized task TOML.
  # A stable release-SHA offset plus locked-task ordinal gives this four-task
  # matrix an exact 2/2 AB/BA split per repetition without mutable state.
  # Repetitions alternate each task; the exceptional fresh pair reverses its
  # primary order. `--task` remains a non-release diagnostic, so one selected
  # task is not represented as full-lock order balance.
  conditionOrder: release-hash-balanced
