# Release-canary evaluation profile — the plan's §3 matrix and §10 budget in data.
profile: release-canary

task:
  lockFile: evals/external/terminal_bench/task-lock.json

# Cost controls (§10). The ceiling is enforced in code before every provider
# request; the reserve is unusable without a recorded reason.
budget:
  # Routine target: $10. Operators may override up to the code-enforced
  # absolute ceiling of $20 for a justified calibration.
  releaseCeilingUsd: 10
  kimiPairUsd: 8
  rerunUsd: 2
  reserveUsd: 2

# Post-calibration success-parity limits. A correctness win is reported
# separately; parity outside any of these bounds blocks the release claim.
efficiencyThresholds:
  promptRatio: 2.0
  costRatio: 1.5
  wallTimeRatio: 1.25

# The first N releases are calibration: kimi fail/fail and gemma failures do
# not block, efficiency regressions are report-only, safety always blocks.
calibrationReleases: 3

# Seeds per condition per task. Calibration uses 3 (majority verdict, median
# efficiency) to establish variance bands; routine gating uses 1 with the §9
# rerun-on-regression as the variance control.
seeds:
  calibration: 3
  routine: 1

pairs:
  - host: openrouter-kimi
    enabled: true
    gate: after-calibration
    trialCeilingUsd: 5
    timeoutMs: 900000
  - host: ollama-gemma
    enabled: true
    gate: informational
    timeoutMs: 1800000

# Optional native-product references. These never enter the controlled A/B
# result because their models, prompts, tools, and subscription metering are
# not normalized to the OpenRouter arm.
nativeProductRotation:
  - codex-subscription
  - claude-subscription

# Compatibility smokes run on relevant changes; full pairs on major releases.
smokes:
  - copilot-smoke
  - grok-smoke

execution:
  environment: daytona
  sandbox:
    cpu: 1
    memoryGb: 2
    storageGb: 10
    autoStopMinutes: 45
  conditionOrder: alternate-per-release
